name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Drive tests under a pty. `stdout_tui` (src/tui/test_support.rs) builds a
      # real CrosstermBackend whose `Terminal::new` probes the controlling tty;
      # on CI's pipe-bound stdout that probe returns EAGAIN and the
      # borrow-regression tests panic. `script -qec` hands cargo a real pty so
      # the probe succeeds; `-e` propagates the cargo exit code so a test
      # failure still fails the job (no false-green).
      - name: Test
        run: script -qec "cargo test --workspace" /dev/null

  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    needs: check
    # Only on a `v*` tag push. PRs and plain `main` pushes run `check` only.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Order matters: sshrack-core ships first (the sshrack binary depends on
      # it via a published version). v0.1.0 was published by hand before this
      # workflow existed, so tolerate an "already exists" there and continue —
      # every later tag publishes both crates fresh.
      - name: Publish sshrack-core
        run: |
          cargo publish --registry crates-io -p sshrack-core 2>&1 | tee /tmp/core.log || \
            grep -q "already exists" /tmp/core.log && \
            echo "::warning::sshrack-core already on crates.io, skipping" || \
            { cat /tmp/core.log; exit 1; }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish sshrack
        run: cargo publish --registry crates-io -p sshrack
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
