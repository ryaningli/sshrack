name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Drive tests under a pty. `stdout_tui` (src/tui/test_support.rs) builds a
      # real CrosstermBackend whose `Terminal::new` probes the controlling tty;
      # on CI's pipe-bound stdout that probe returns EAGAIN and the
      # borrow-regression tests panic. `script -qec` hands cargo a real pty so
      # the probe succeeds; `-e` propagates the cargo exit code so a test
      # failure still fails the job (no false-green).
      - name: Test
        run: script -qec "cargo test --workspace" /dev/null
