[workspace]
resolver = "3"
members = ["crates/sshrack-core"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ryaningli"]
repository = "https://github.com/ryaningli/sshrack"
keywords = ["ssh", "sftp", "terminal", "tui", "remote"]

[package]
name = "sshrack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Terminal-native remote server management over ssh/scp/sftp: a config + credential layer with an interactive TUI and a scriptable CLI."
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
sshrack-core = { path = "crates/sshrack-core", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
ulid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TUI front end (ratatui shell in src/tui/).
ratatui = "0.30"
crossterm = "0.29"
nucleo-matcher = "0.3"
unicode-width = "0.2"
# Multiline text area widget for the inline-key paste rows (Task 1 adds the
# dep; Tasks 2/4 wire it into the cred/host wizards). Default features pull in
# crossterm, matching our existing ratatui backend.
ratatui-textarea = "0.9"
signal-hook = "0.3"
# No-echo passphrase + yes/no prompts for the CLI's default-interactive mode
# (binary crate only — sshrack-core stays zero-UI).
rpassword = "7"

[dev-dependencies]
tempfile = "3"
# Snapshot testing for TUI render output. Pilot: help overlay only (see
# docs/superpowers/plans/2026-07-07-insta-snapshot-pilot.md).
insta = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
