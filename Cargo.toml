[workspace]
resolver = "3"
members = ["crates/sshrack-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ryaningli"]

[package]
name = "sshrack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
sshrack-core = { path = "crates/sshrack-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
ulid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TUI front end (ratatui shell in src/tui/).
ratatui = "0.30"
crossterm = "0.29"
nucleo-matcher = "0.3"
unicode-width = "0.2"
# Multiline text area widget for the inline-key paste rows (Task 1 adds the
# dep; Tasks 2/4 wire it into the cred/host wizards). Default features pull in
# crossterm, matching our existing ratatui backend.
ratatui-textarea = "0.9"

[dev-dependencies]
tempfile = "3"
# Snapshot testing for TUI render output. Pilot: help overlay only (see
# docs/superpowers/plans/2026-07-07-insta-snapshot-pilot.md).
insta = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
