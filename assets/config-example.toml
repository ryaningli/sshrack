# Demo sshrack config — restores the 7 sample hosts used in the README TUI
# recording (1 real loopback host + 6 fictional ones).
#
# Safe to commit: no passwords and no private-key material. `local` stores only
# the *path* to a key (not the key itself), and the fictional hosts have no auth.
#
# Reproduce the demo:
#   cp assets/config-example.toml ~/.config/sshrack/config.toml
#   sshrack                       # TUI lists these 7 hosts; type "loc" -> local
#
# `local` uses SSH key auth against the loopback (127.0.0.1). Adjust `user` and
# `key` to your own login/key path if you want `local` to actually connect.

format_version = 1
credentials = []

[[hosts]]
id = "01KZQBWEQ0B9S6GK6NGP5TM09S"
name = "local"
host = "127.0.0.1"
port = 22

[hosts.auth]
user = "ryan"
key = "/home/ryan/.ssh/id_rsa"

[[hosts]]
id = "01KZQBWEQ70396CQXZKFSBR5ND"
name = "web-prod-01"
host = "10.0.1.10"
port = 22

[hosts.auth]
